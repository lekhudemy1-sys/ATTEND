<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 20px;
    }

    #loginScreen {
      max-width: 380px;
      margin: 80px auto;
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    #loginScreen h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    #loginScreen p {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    #loginScreen input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    #loginScreen button,
    .filters button,
    .add-form button {
      background: #4f46e5;
      color: #ffffff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    #loginScreen button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginError {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    #dashboard {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 24px;
    }

    .logout-btn {
      background: #ef4444;
      color: #ffffff;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .section {
      background: #ffffff;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .section h2 {
      font-size: 18px;
      color: #334155;
      margin-bottom: 16px;
    }

    .add-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-form input {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-form button {
      background: #16a34a;
      padding: 11px 20px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }

    .filters input,
    .filters select {
      padding: 9px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
    }

    .filters button {
      padding: 9px 16px;
    }

    .secondary-btn {
      background: #64748b !important;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }
