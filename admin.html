<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 20px;
    }

    #loginScreen {
      max-width: 380px;
      margin: 80px auto;
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    #loginScreen h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    #loginScreen p {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    #loginScreen input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    #loginScreen button,
    .filters button,
    .add-form button {
      background: #4f46e5;
      color: #ffffff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    #loginScreen button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginError {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    #dashboard {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 24px;
    }

    .logout-btn {
      background: #ef4444;
      color: #ffffff;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .section {
      background: #ffffff;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .section h2 {
      font-size: 18px;
      color: #334155;
      margin-bottom: 16px;
    }

    .add-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-form input {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-form button {
      background: #16a34a;
      padding: 11px 20px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }

    .filters input,
    .filters select {
      padding: 9px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
    }

    .filters button {
      padding: 9px 16px;
    }

    .secondary-btn {
      background: #64748b !important;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:hover {
      background: #f8fafc;
    }

    .status-present,
    .status-leave {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-present {
      background: #dcfce7;
      color: #166534;
    }

    .status-leave {
      background: #fef3c7;
      color: #92400e;
    }

    .edit-btn,
    .delete-btn {
      color: #ffffff;
      border: 0;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .edit-btn {
      background: #2563eb;
    }

    .delete-btn {
      background: #ef4444;
      margin-left: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.56);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
    }

    .modal-content h3 {
      margin-bottom: 18px;
    }

    .modal-content label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
      color: #475569;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 11px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 15px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #334155;
    }

    .msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .msg.success {
      background: #dcfce7;
      color: #166534;
    }

    .msg.error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      #loginScreen {
        margin-top: 48px;
      }

      .section {
        padding: 16px;
      }

      .filters input,
      .filters select,
      .filters button,
      .add-form input,
      .add-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <h1>Admin Login</h1>
    <p>Enter password to access dashboard</p>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" type="button">Login</button>
    <div id="loginError">Wrong password</div>
  </div>

  <div id="dashboard">
    <header>
      <h1>Attendance Admin</h1>
      <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
    </header>

    <div class="section">
      <h2>Add New Employee</h2>
      <div class="add-form">
        <input type="text" id="newEmpName" placeholder="Enter employee name">
        <button id="addEmployeeBtn" type="button">Add Name</button>
      </div>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="section">
      <h2>Attendance Records</h2>

      <div class="filters">
        <input type="date" id="filterDate">
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="present">Present</option>
          <option value="leave">Leave</option>
        </select>
        <button id="filterBtn" type="button">Filter</button>
        <button class="secondary-btn" id="clearBtn" type="button">Clear</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Name</th>
              <th>Status</th>
              <th>Reason</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="attendanceBody">
            <tr>
              <td colspan="6" style="text-align:center; color:#94a3b8;">Login to load records</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Edit Attendance</h3>
      <input type="hidden" id="editId">

      <label for="editDate">Date</label>
      <input type="date" id="editDate">

      <label for="editTime">Time</label>
      <input type="time" id="editTime" step="1">

      <label for="editStatus">Status</label>
      <select id="editStatus">
        <option value="present">Present</option>
        <option value="leave">Leave</option>
      </select>

      <label for="editReason">Reason for leave</label>
      <input type="text" id="editReason" placeholder="Optional">

      <div class="modal-actions">
        <button class="btn-save" id="saveEditBtn" type="button">Save</button>
        <button class="btn-cancel" id="cancelEditBtn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mwluvdedgdshbdnmyjyl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pT4vjOCHqiiqZxZAcxHpjg_neX05R-M';
    const ADMIN_PASSWORD = '1234';

    let db = null;

    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const passwordInput = document.getElementById('passwordInput');
    const loginError = document.getElementById('loginError');
    const attendanceBody = document.getElementById('attendanceBody');
    const editModal = document.getElementById('editModal');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function showDashboard() {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      loadAttendance();
    }

    function showMessage(element, type, text) {
      element.style.display = 'block';
      element.className = 'msg ' + type;
      element.textContent = text;
    }

    function requireSupabase() {
      if (!db) {
        alert('Supabase did not load. Check your internet connection or the CDN script URL.');
        return false;
      }
      return true;
    }

    function login() {
      const pass = passwordInput.value.trim();

      if (pass === ADMIN_PASSWORD) {
        loginError.style.display = 'none';
        sessionStorage.setItem('adminLoggedIn', 'true');
        showDashboard();
      } else {
        loginError.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('adminLoggedIn');
      passwordInput.value = '';
      dashboard.style.display = 'none';
      loginScreen.style.display = 'block';
    }

    async function addEmployee() {
      if (!requireSupabase()) return;

      const nameInput = document.getElementById('newEmpName');
      const msg = document.getElementById('addMsg');
      const name = nameInput.value.trim();

      if (!name) {
        showMessage(msg, 'error', 'Please enter a name');
        return;
      }

      const { error } = await db.from('employees').insert({ name });

      if (error) {
        const message = error.message.toLowerCase().includes('duplicate')
          ? 'Name already exists'
          : error.message;
        showMessage(msg, 'error', message);
        return;
      }

      showMessage(msg, 'success', '"' + name + '" added successfully');
      nameInput.value = '';

      setTimeout(function () {
        msg.style.display = 'none';
      }, 3000);
    }

    async function loadAttendance() {
      if (!requireSupabase()) return;

      attendanceBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Loading...</td></tr>';

      let query = db
        .from('attendance')
        .select('*')
        .order('date', { ascending: false })
        .order('time', { ascending: false });

      const filterDate = document.getElementById('filterDate').value;
      const filterStatus = document.getElementById('filterStatus').value;

      if (filterDate) query = query.eq('date', filterDate);
      if (filterStatus) query = query.eq('status', filterStatus);

      const { data, error } = await query;

      if (error) {
        attendanceBody.innerHTML = '<tr><td colspan="6" style="color:#dc2626;">Error: ' + escapeHtml(error.message) + '</td></tr>';
        return;
      }

      if (!data || data.length === 0) {
        attendanceBody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No records found</td></tr>';
        return;
      }

      attendanceBody.innerHTML = '';

      data.forEach(function (row) {
        const tr = document.createElement('tr');

        const status = row.status === 'leave' ? 'leave' : 'present';
        const reason = row.reason || '-';

        tr.innerHTML =
          '<td>' + escapeHtml(row.date) + '</td>' +
          '<td>' + escapeHtml(row.time) + '</td>' +
          '<td><strong>' + escapeHtml(row.employee_name) + '</strong></td>' +
          '<td><span class="status-' + status + '">' + escapeHtml(status.toUpperCase()) + '</span></td>' +
          '<td>' + escapeHtml(reason) + '</td>' +
          '<td>' +
            '<button class="edit-btn" type="button">Edit</button>' +
            '<button class="delete-btn" type="button">Delete</button>' +
          '</td>';

        tr.querySelector('.edit-btn').addEventListener('click', function () {
          openEdit(row);
        });

        tr.querySelector('.delete-btn').addEventListener('click', function () {
          deleteRecord(row.id);
        });

        attendanceBody.appendChild(tr);
      });
    }

    function clearFilters() {
      document.getElementById('filterDate').value = '';
      document.getElementById('filterStatus').value = '';
      loadAttendance();
    }

    function openEdit(row) {
      document.getElementById('editId').value = row.id;
      document.getElementById('editDate').value = row.date || '';
      document.getElementById('editTime').value = row.time || '';
      document.getElementById('editStatus').value = row.status || 'present';
      document.getElementById('editReason').value = row.reason || '';
      editModal.classList.add('show');
    }

    function closeModal() {
      editModal.classList.remove('show');
    }

    async function saveEdit() {
      if (!requireSupabase()) return;

      const id = document.getElementById('editId').value;
      const date = document.getElementById('editDate').value;
      const time = document.getElementById('editTime').value;
      const status = document.getElementById('editStatus').value;
      const reason = document.getElementById('editReason').value.trim() || null;

      const { error } = await db
        .from('attendance')
        .update({ date: date, time: time, status: status, reason: reason })
        .eq('id', id);

      if (error) {
        alert('Error updating: ' + error.message);
        return;
      }

      closeModal();
      loadAttendance();
    }

    async function deleteRecord(id) {
      if (!requireSupabase()) return;
      if (!confirm('Are you sure you want to delete this record?')) return;

      const { error } = await db.from('attendance').delete().eq('id', id);

      if (error) {
        alert('Error deleting: ' + error.message);
        return;
      }

      loadAttendance();
    }

    function setupApp() {
      if (!window.supabase) {
        alert('Supabase library did not load. The page needs internet access.');
        return;
      }

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('addEmployeeBtn').addEventListener('click', addEmployee);
      document.getElementById('filterBtn').addEventListener('click', loadAttendance);
      document.getElementById('clearBtn').addEventListener('click', clearFilters);
      document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
      document.getElementById('cancelEditBtn').addEventListener('click', closeModal);

      passwordInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') login();
      });

      editModal.addEventListener('click', function (event) {
        if (event.target === editModal) closeModal();
      });

      if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        showDashboard();
      }
    }

    window.addEventListener('load', setupApp);
  </script>
</body>
</html>
