<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 48px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      width: 220px;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .card p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .user-card:hover {
      border-color: #22c55e;
    }

    .admin-card:hover {
      border-color: #818cf8;
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 540px) {
      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📍</div>
    <h1>Attendance System</h1>
    <p class="subtitle">Select your role to continue</p>

    <div class="cards">
      <a href="user.html" class="card user-card">
        <div class="card-icon">👤</div>
        <h2>User</h2>
        <p>Mark Present or Leave</p>
      </a>

      <a href="admin.html" class="card admin-card">
        <div class="card-icon">🔐</div>
        <h2>Admin</h2>
        <p>Manage attendance and employees</p>
      </a>
    </div>

    <footer>
      Location-based attendance • Powered by Supabase
    </footer>
  </div>
</body>
</html>
