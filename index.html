<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f8fafc;
    }
    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.25);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 40px;
    }
    .cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      width: 200px;
      text-decoration: none;
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .card:hover {
      background: #334155;
      border-color: #6366f1;
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
    }
    .card-icon {
      font-size: 36px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #64748b;
    }
    @media (max-width: 480px) {
      .card { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📍</div>
    <h1>Attendance System</h1>
    <p class="subtitle">Select your role to continue</p>
    <div class="cards">
      <a href="user.html" class="card">
        <div class="card-icon">👤</div>
        <h2>Employee</h2>
        <p>Mark present or leave</p>
      </a>
      <a href="admin.html" class="card">
        <div class="card-icon">🔐</div>
        <h2>Admin</h2>
        <p>Manage records & staff</p>
      </a>
    </div>
    <footer>Location-based • Secure • Powered by Supabase</footer>
  </div>
</body>
</html>
