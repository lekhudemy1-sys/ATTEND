<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — Employee</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
      color: #f8fafc;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #cbd5e1;
      font-size: 13px;
    }
    select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      background: #0f172a;
      color: #f8fafc;
      font-family: inherit;
      transition: border 0.15s;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: inherit;
    }
    button:active { transform: scale(0.98); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-present {
      background: #22c55e;
      color: #fff;
    }
    .btn-leave {
      background: #f59e0b;
      color: #fff;
    }
    .btn-submit-leave {
      background: #f59e0b;
      color: #fff;
      width: 100%;
      margin-top: 4px;
    }
    #status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      display: none;
      line-height: 1.5;
    }
    .success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .info {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .leave-section {
      display: none;
      margin-top: 12px;
    }
    .leave-section.show { display: block; }
    .back-link {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
    .back-link:hover { color: #a5b4fc; }
    .lock-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .lock-box strong {
      display: block;
      color: #fca5a5;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .lock-box span {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 Attendance</h1>
    <p class="subtitle">Present only allowed at office location</p>

    <div id="lockBox" class="lock-box" style="display:none;">
      <strong>Device Temporarily Locked</strong>
      <span id="lockText"></span>
    </div>

    <label for="employeeSelect">Your Name</label>
    <select id="employeeSelect">
      <option value="">Loading names...</option>
    </select>

    <div class="btn-group">
      <button class="btn-present" id="presentBtn" type="button">Present</button>
      <button class="btn-leave" id="leaveBtn" type="button">Leave</button>
    </div>

    <div class="leave-section" id="leaveSection">
      <label for="reason">Reason for Leave</label>
      <textarea id="reason" rows="3" placeholder="Enter reason..."></textarea>
      <button class="btn-submit-leave" id="submitLeaveBtn" type="button">Submit Leave</button>
    </div>

    <div id="status"></div>
    <a href="index.html" class="back-link">← Back to home</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://mwluvdedgdshbdnmyjyl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pT4vjOCHqiiqZxZAcxHpjg_neX05R-M';
    const OFFICE_LAT = 21.2758151;
    const OFFICE_LNG = 81.6322723;
    const MAX_DISTANCE = 10;
    const LOCK_HOURS = 5;
    const LOCK_MS = LOCK_HOURS * 60 * 60 * 1000;
    const LOCK_KEY = 'attendanceLockUntil';

    let db = null;
    const employeeSelect = document.getElementById('employeeSelect');
    const statusEl = document.getElementById('status');
    const presentBtn = document.getElementById('presentBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const leaveSection = document.getElementById('leaveSection');
    const reasonInput = document.getElementById('reason');
    const lockBox = document.getElementById('lockBox');
    const lockText = document.getElementById('lockText');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function showStatus(message, type) {
      statusEl.style.display = 'block';
      statusEl.className = type;
      statusEl.innerHTML = message;
    }

    function requireSupabase() {
      if (!db) {
        showStatus('Connection failed. Check your internet.', 'error');
        return false;
      }
      return true;
    }

    function getLockUntil() {
      const raw = localStorage.getItem(LOCK_KEY);
      if (!raw) return null;
      const ts = Number(raw);
      return Number.isFinite(ts) ? ts : null;
    }

    function isDeviceLocked() {
      const until = getLockUntil();
      return until !== null && Date.now() < until;
    }

    function getRemainingLockText() {
      const until = getLockUntil();
      if (!until || Date.now() >= until) return '';
      const remainingMs = until - Date.now();
      const totalMinutes = Math.ceil(remainingMs / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      if (hours > 0) return hours + ' hr ' + minutes + ' min';
      return minutes + ' min';
    }

    function setDeviceLock() {
      localStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MS));
    }

    function applyLockUI() {
      if (!isDeviceLocked()) {
        lockBox.style.display = 'none';
        return false;
      }
      presentBtn.disabled = true;
      leaveBtn.disabled = true;
      leaveSection.classList.remove('show');
      employeeSelect.disabled = true;
      lockBox.style.display = 'block';
      lockText.innerHTML = 'Attendance was already marked from this device.<br>Available again in <strong>' + getRemainingLockText() + '</strong>.';
      return true;
    }

    function getSelectedEmployee() {
      const option = employeeSelect.options[employeeSelect.selectedIndex];
      if (!employeeSelect.value || !option) return null;
      return { id: employeeSelect.value, name: option.dataset.name };
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function loadEmployees() {
      if (!requireSupabase()) return;
      employeeSelect.innerHTML = '<option value="">Loading names...</option>';
      const { data, error } = await db.from('employees').select('id, name').order('name');
      if (error) {
        employeeSelect.innerHTML = '<option value="">Error loading names</option>';
        showStatus('Could not load employees: ' + escapeHtml(error.message), 'error');
        return;
      }
      if (!data || data.length === 0) {
        employeeSelect.innerHTML = '<option value="">No employees yet</option>';
        return;
      }
      employeeSelect.innerHTML = '<option value="">Select your name</option>';
      data.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.textContent = emp.name;
        opt.dataset.name = emp.name;
        employeeSelect.appendChild(opt);
      });
    }

    function showLeaveForm() {
      if (applyLockUI()) return;
      if (!getSelectedEmployee()) {
        showStatus('Please select your name first', 'error');
        return;
      }
      leaveSection.classList.add('show');
      reasonInput.focus();
    }

    async function saveAttendance(record, successMessage) {
      if (!requireSupabase()) return false;
      const { error } = await db.from('attendance').insert(record);
      if (error) {
        showStatus('Error: ' + escapeHtml(error.message), 'error');
        return false;
      }
      setDeviceLock();
      applyLockUI();
      showStatus(successMessage, 'success');
      return true;
    }

    async function markPresent() {
      if (applyLockUI()) return;
      const emp = getSelectedEmployee();
      if (!emp) {
        showStatus('Please select your name first', 'error');
        return;
      }
      if (!navigator.geolocation) {
        showStatus('Location not supported by this browser.', 'error');
        return;
      }
      showStatus('Checking your location...', 'info');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          if (applyLockUI()) return;
          const dist = getDistance(pos.coords.latitude, pos.coords.longitude, OFFICE_LAT, OFFICE_LNG);
          if (dist > MAX_DISTANCE) {
            showStatus('You are too far from the office (' + Math.round(dist) + ' m). Present is only allowed on site.', 'error');
            return;
          }
          const now = new Date();
          const dateStr = now.toISOString().split('T')[0];
          const timeStr = now.toTimeString().slice(0, 8);
          await saveAttendance({
            employee_id: emp.id,
            employee_name: emp.name,
            date: dateStr,
            time: timeStr,
            status: 'present',
            reason: null
          }, 'Present marked successfully<br><strong>' + escapeHtml(emp.name) + '</strong><br>' + dateStr + ' · ' + timeStr);
        },
        () => showStatus('Location access denied. Please allow location permission.', 'error'),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    async function markLeave() {
      if (applyLockUI()) return;
      const emp = getSelectedEmployee();
      if (!emp) {
        showStatus('Please select your name first', 'error');
        return;
      }
      const reason = reasonInput.value.trim();
      if (!reason) {
        showStatus('Please enter a reason for leave', 'error');
        return;
      }
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toTimeString().slice(0, 8);
      showStatus('Saving leave...', 'info');
      await saveAttendance({
        employee_id: emp.id,
        employee_name: emp.name,
        date: dateStr,
        time: timeStr,
        status: 'leave',
        reason: reason
      }, 'Leave marked successfully<br><strong>' + escapeHtml(emp.name) + '</strong><br>' + dateStr + ' · ' + timeStr + '<br>Reason: ' + escapeHtml(reason));
    }

    function setupApp() {
      if (!window.supabase) {
        showStatus('Library failed to load. Check internet connection.', 'error');
        employeeSelect.innerHTML = '<option value="">Failed to load</option>';
        return;
      }
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      presentBtn.addEventListener('click', markPresent);
      leaveBtn.addEventListener('click', showLeaveForm);
      document.getElementById('submitLeaveBtn').addEventListener('click', markLeave);
      employeeSelect.addEventListener('change', () => {
        if (isDeviceLocked()) { applyLockUI(); return; }
        statusEl.style.display = 'none';
        presentBtn.disabled = false;
        leaveBtn.disabled = false;
        leaveSection.classList.remove('show');
        reasonInput.value = '';
      });
      if (applyLockUI()) {
        loadEmployees();
        return;
      }
      loadEmployees();
    }

    window.addEventListener('load', setupApp);
  </script>
</body>
</html>
