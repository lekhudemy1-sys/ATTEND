<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - User</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444;
      font-size: 14px;
    }
    select, textarea, input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border 0.2s;
    }
    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-present {
      background: #22c55e;
      color: white;
    }
    .btn-leave {
      background: #f59e0b;
      color: white;
    }
    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 500;
      display: none;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .info {
      background: #e0e7ff;
      color: #3730a3;
      border: 1px solid #a5b4fc;
    }
    .leave-section {
      display: none;
      margin-top: 10px;
    }
    .leave-section.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 Attendance</h1>
    <p class="subtitle">Mark Present only at office location</p>

    <label for="employeeSelect">Select Your Name</label>
    <select id="employeeSelect">
      <option value="">-- Loading names --</option>
    </select>

    <div class="btn-group">
      <button class="btn-present" id="presentBtn" onclick="markPresent()">Present</button>
      <button class="btn-leave" id="leaveBtn" onclick="showLeaveForm()">Leave</button>
    </div>

    <div class="leave-section" id="leaveSection">
      <label for="reason">Reason for Leave</label>
      <textarea id="reason" rows="3" placeholder="Enter reason..."></textarea>
      <button class="btn-leave" style="width:100%; margin-top:4px;" onclick="markLeave()">Submit Leave</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // ====================== CONFIG ======================
    // Replace these with your Supabase credentials
    const SUPABASE_URL = 'https://mwluvdedgdshbdnmyjyl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pT4vjOCHqiiqZxZAcxHpjg_neX05R-M';

    // Office location (change to your real coordinates)
    const OFFICE_LAT = 28.6139;   // Example: New Delhi
    const OFFICE_LNG = 77.2090;
    const MAX_DISTANCE = 100;     // meters
    // ====================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load employee names
    async function loadEmployees() {
      const select = document.getElementById('employeeSelect');
      const { data, error } = await supabase
        .from('employees')
        .select('id, name')
        .order('name');

      if (error) {
        select.innerHTML = '<option value="">Error loading names</option>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        select.innerHTML = '<option value="">No employees yet – add from Admin</option>';
        return;
      }

      select.innerHTML = '<option value="">-- Select your name --</option>';
      data.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.textContent = emp.name;
        opt.dataset.name = emp.name;
        select.appendChild(opt);
      });
    }

    function showStatus(message, type) {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.className = type;
      el.innerHTML = message;
    }

    function getSelectedEmployee() {
      const select = document.getElementById('employeeSelect');
      const option = select.options[select.selectedIndex];
      if (!select.value) return null;
      return {
        id: select.value,
        name: option.dataset.name
      };
    }

    // Haversine distance in meters
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function showLeaveForm() {
      const emp = getSelectedEmployee();
      if (!emp) {
        showStatus('Please select your name first', 'error');
        return;
      }
      document.getElementById('leaveSection').classList.add('show');
    }

    async function markPresent() {
      const emp = getSelectedEmployee();
      if (!emp) {
        showStatus('Please select your name first', 'error');
        return;
      }

      showStatus('Checking your location...', 'info');

      if (!navigator.geolocation) {
        showStatus('Geolocation not supported by your browser', 'error');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = getDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);

          if (distance > MAX_DISTANCE) {
            showStatus(`❌ You are too far from office (${Math.round(distance)} m). Present only allowed at location.`, 'error');
            return;
          }

          // Location OK → save attendance
          const now = new Date();
          const dateStr = now.toISOString().split('T')[0];
          const timeStr = now.toTimeString().slice(0, 8);

          const { error } = await supabase.from('attendance').insert({
            employee_id: emp.id,
            employee_name: emp.name,
            date: dateStr,
            time: timeStr,
            status: 'present',
            reason: null
          });

          if (error) {
            showStatus('Error saving attendance: ' + error.message, 'error');
            return;
          }

          showStatus(`✅ Present marked successfully!<br><strong>${emp.name}</strong><br>${dateStr} at ${timeStr}`, 'success');
          document.getElementById('presentBtn').disabled = true;
          document.getElementById('leaveBtn').disabled = true;
        },
        (err) => {
          showStatus('Location access denied or unavailable. Please allow location permission.', 'error');
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    }

    async function markLeave() {
      const emp = getSelectedEmployee();
      if (!emp) {
        showStatus('Please select your name first', 'error');
        return;
      }

      const reason = document.getElementById('reason').value.trim();
      if (!reason) {
        showStatus('Please enter a reason for leave', 'error');
        return;
      }

      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toTimeString().slice(0, 8);

      showStatus('Saving leave...', 'info');

      const { error } = await supabase.from('attendance').insert({
        employee_id: emp.id,
        employee_name: emp.name,
        date: dateStr,
        time: timeStr,
        status: 'leave',
        reason: reason
      });

      if (error) {
        showStatus('Error saving leave: ' + error.message, 'error');
        return;
      }

      showStatus(`🟡 Leave marked successfully!<br><strong>${emp.name}</strong><br>${dateStr} at ${timeStr}<br>Reason: ${reason}`, 'success');
      document.getElementById('presentBtn').disabled = true;
      document.getElementById('leaveBtn').disabled = true;
      document.getElementById('leaveSection').classList.remove('show');
    }

    // Initialize
    loadEmployees();
  </script>
</body>
</html>
